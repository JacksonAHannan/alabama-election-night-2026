name: Collect returns and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Election-night updates, November 3–5 UTC; GitHub schedules can be delayed.
    - cron: '2-59/5 * 3-5 11 *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: election-dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check election update window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || [ "$(date -u +%Y)" = 2026 ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.window.outputs.publish == 'true'
      - name: Restore accepted source observations
        if: steps.window.outputs.publish == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/results.sqlite
          key: election-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: election-state-v1-
      - name: Restore Rust build cache
        if: steps.window.outputs.publish == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-pages-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs') }}
          restore-keys: rust-pages-${{ runner.os }}-
      - name: Collect and export the public dashboard
        if: steps.window.outputs.publish == 'true'
        run: |
          mkdir -p runtime
          if [ ! -f runtime/results.sqlite ]; then
            cp deployment/initial-results.sqlite runtime/results.sqlite
          fi
          rustup default stable
          cargo test --locked
          cargo build --release --locked
          target/release/alabama-election-night collect-once
          target/release/alabama-election-night export-site --output site
          node --check site/app.js
          node --test tests/benchmarks.cjs
      - name: Preserve accepted observations for the next collection
        if: always() && steps.window.outputs.publish == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/results.sqlite
          key: election-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure GitHub Pages
        if: steps.window.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload public site
        if: steps.window.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1
      - name: Publish GitHub Pages
        if: steps.window.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
